<!DOCTYPE html>

<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZS Sport AI - Maaltijden</title>
  <link rel="stylesheet" href="../CSS/maaltijden.css">
</head>

<body>

  <!-- Video achtergrond -->

  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="../mp4/gym-video.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Pagina -->

  <main class="container">

<a href="dashboard.html" class="back-button">
  ← Terug naar dashboard
</a>

<section class="hero">
  <span class="badge">🥗 AI Voedingscoach</span>

  <h1>Sport & Maaltijden</h1>

  <p>
    Kies jouw sportdoel en krijg gezonde maaltijdideeën
    die passen bij jouw training.
  </p>
</section>

<!-- Doel kiezen -->
<section class="meal-generator">

  <h2>🍽️ Kies jouw doel</h2>

  <select id="doel">
    <option value="spieropbouw">💪 Spieropbouw</option>
    <option value="afvallen">🔥 Afvallen</option>
    <option value="conditie">🏃 Conditie</option>
    <option value="voetbal">⚽ Voetbal</option>
    <option value="hardlopen">🏃 Hardlopen</option>
  </select>

  <button onclick="genereerMaaltijden()">
    🤖 Genereer maaltijden
  </button>

</section>

<!-- Maaltijden -->
<section class="meals-section">

  <h2>🍴 Jouw maaltijdadvies</h2>

  <div id="maaltijden" class="meals-grid">

    <div class="empty-message">
      Kies jouw doel en klik op "Genereer maaltijden".
    </div>

  </div>

</section>
  </main>

  <script src="../JAVA SCRIPT/maaltijden.js"></script>

</body>
</html>
